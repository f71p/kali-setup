# ── Font ──────────────────────────────────────────────────
font_family      JetBrains Mono
font_size        11.0

# ── Behaviour ─────────────────────────────────────────────
scrollback_lines         20000
copy_on_select           clipboard
enable_audio_bell        no
confirm_os_window_close  0
url_style                curly
shell_integration        enabled
# Hide the mouse pointer as soon as you type
mouse_hide_wait          -1

# ── Keys ──────────────────────────────────────────────────
# Copy the last command ("$ command" line, saved by ~/.zshrc.d/marks.zsh) and everything it printed.
# Inside tmux (in_tmux is set by ~/.zshrc.d/marks.zsh) it sends tmux's prefix y instead, which does the same.
# (trailing spaces and blank lines trimmed; kitten clipboard needs a tty, hence the overlay)
map ctrl+shift+y launch --stdin-source=@last_cmd_output --type=overlay sh -c "{ sed '1s/^/$ /' \"${XDG_RUNTIME_DIR:-/tmp}/last-cmd-kitty$1\" 2>/dev/null; sed 's/[[:space:]]*$//' | sed -e :a -e '/^\\n*$/{$d;N;ba' -e '}'; } | kitten clipboard" _ @active-kitty-window-id
map --when-focus-on var:in_tmux ctrl+shift+y send_text all \x01y

# Ctrl+Shift+P then a letter labels matching text on screen; press a label to type it in.
# Built in: F path, H hash, W word, L line. Added: I for IP addresses.
map ctrl+shift+p>i kitten hints --type ip --program -

# ── Window & tabs ─────────────────────────────────────────
window_padding_width     8
tab_bar_edge             top


