# ── Prefix ────────────────────────────────────────────────
# Keep Ctrl+B. To switch to Ctrl+A, comment the C-b lines and
# uncomment the C-a block.
# set -g prefix C-b
# bind C-b send-prefix
# unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Splits ────────────────────────────────────────────────
# V = vertical (side by side)   S = horizontal (stacked)
# New panes open in the current pane's working directory.
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind V split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S split-window -v -c "#{pane_current_path}"

# ── Reload config without restarting tmux ─────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Pane navigation: prefix then h/j/k/l (vim-style) ──────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Quality of life ───────────────────────────────────────
set -g mouse on                 # click/scroll/resize panes with the mouse
set -s set-clipboard on         # let apps inside tmux (nvim) set the clipboard via OSC 52
set -g history-limit 50000      # bigger scrollback for long tool output
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers contiguous
set -sg escape-time 10          # stop Esc lag (matters in vim)
setw -g mode-keys vi            # vi keys in copy mode
set -g default-terminal "tmux-256color"

# ── Status bar ────────────────────────────────────────────
# Right side: ● REC <label> while `rec` runs in the active pane, VPN/eth0 IP, clock.
# Window tabs get a red ● if any pane in them is recording (checks the active pane).
set -g status-interval 5
set -g status-right-length 80
set -g status-right "#{?#{@rec},#[bg=red fg=white bold] ● REC #{@rec} #[default]  ,}#(~/.local/bin/tmux-netinfo)  %H:%M "
setw -g window-status-format         "#I:#W#{?#{@rec},#[bg=red fg=white]●#[default],}#{?window_flags,#{window_flags}, }"
setw -g window-status-current-format "#I:#W#{?#{@rec},#[bg=red fg=white]●#[default],}#{?window_flags,#{window_flags}, }"
