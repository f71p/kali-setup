# Keys follow keybinds.md: the modifier picks the layer, the letter picks the action.
# Esc after the prefix just backs out; nothing here is bound to plain Esc.

# ── Prefix ────────────────────────────────────────────────
# Ctrl+A, then the key. Ctrl+A twice sends Ctrl+A (start of line).
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Splits ────────────────────────────────────────────────
# V = vertical (side by side)   S = horizontal (stacked)
# New panes open in the current pane's working directory.
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind V split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S split-window -v -c "#{pane_current_path}"
# Enter = new pane, split along the longer side (cells are about twice as tall as wide)
bind Enter if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" \
    "split-window -h -c '#{pane_current_path}'" \
    "split-window -v -c '#{pane_current_path}'"

# ── Reload config without restarting tmux ─────────────────
bind R source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Panes: prefix h/j/k/l focuses, prefix Shift+h/j/k/l moves (vim-style) ──
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H swap-pane -t "{left-of}"
bind J swap-pane -t "{down-of}"
bind K swap-pane -t "{up-of}"
bind L swap-pane -t "{right-of}"

# ── Resize mode: prefix r, then h/j/k/l as often as you like, Esc to leave ──
bind r switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root

# ── Zoom, layouts, session list ───────────────────────────
bind f resize-pane -Z           # zoom pane (prefix z still works too)
bind o next-layout              # cycle layouts (moved from Space)
bind Space choose-tree -Zs      # sessions and windows (like prefix w)

# ── Floating terminal: prefix Shift+F opens it over the current pane, prefix Shift+F again hides it ──
# It's a separate session ("popup") shown in a popup, so whatever runs in it keeps going while hidden.
bind F if -F '#{==:#{session_name},popup}' 'detach-client' 'display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "tmux new -A -s popup \\; set status off"'

# ── Windows (tmux's tabs) ─────────────────────────────────
bind c new-window -c "#{pane_current_path}"   # new window in the same folder
bind Tab last-window
# prefix Shift+1–9 sends the pane to window N (made if it doesn't exist). Both US and UK
# shifted digits are bound, so it works on either layout (UK: Shift+2 = ", Shift+3 = £).
bind !   run "tmux join-pane -s '#{pane_id}' -t :1 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :1"
bind @   run "tmux join-pane -s '#{pane_id}' -t :2 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :2"
bind '"' run "tmux join-pane -s '#{pane_id}' -t :2 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :2"
bind '#' run "tmux join-pane -s '#{pane_id}' -t :3 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :3"
bind £   run "tmux join-pane -s '#{pane_id}' -t :3 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :3"
bind '$' run "tmux join-pane -s '#{pane_id}' -t :4 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :4"
bind %   run "tmux join-pane -s '#{pane_id}' -t :5 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :5"
bind ^   run "tmux join-pane -s '#{pane_id}' -t :6 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :6"
bind &   run "tmux join-pane -s '#{pane_id}' -t :7 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :7"
bind *   run "tmux join-pane -s '#{pane_id}' -t :8 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :8"
bind (   run "tmux join-pane -s '#{pane_id}' -t :9 2>/dev/null || tmux break-pane -s '#{pane_id}' -t :9"

# ── Close: q = pane, Shift+Q = window, Shift+Esc = the whole session ──
# Shift+Esc only arrives as its own key if the terminal sends it as CSI u (kitty.conf and the
# wsl role set that up); otherwise it comes through as plain Esc, which does nothing here.
set -s extended-keys on
bind q confirm-before -p "close pane? (y/n)" kill-pane
bind Q confirm-before -p "close window #W? (y/n)" kill-window
bind S-Escape confirm-before -p "kill session #S and everything in it? (y/n)" kill-session

# ── Copy mode (prefix [): v selects, y copies, vim-style ──
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Copy the last command and its output: prefix y (kitty sends this for Ctrl+Shift+Y) ──
# Uses the prompt/output marks from ~/.zshrc.d/marks.zsh, which also saves each command line (put first
# as "$ command"). Trailing blank lines are trimmed; load-buffer -w sends the result to the
# terminal's clipboard (OSC 52).
bind y copy-mode \; send -X previous-prompt \; send -X previous-prompt -o \; send -X begin-selection \; send -X next-prompt \; send -X cursor-up \; send -X end-of-line \; send -X copy-pipe-and-cancel "{ sed '1s/^/\$ /' \"\${XDG_RUNTIME_DIR:-/tmp}/last-cmd-tmux#{pane_id}\" 2>/dev/null; cat; } | perl -0pe 's/\\s+\\z/\\n/' | tmux load-buffer -w -" \; display "copied last output"

# ── Quality of life ───────────────────────────────────────
set -g mouse on                 # click/scroll/resize panes with the mouse
set -s set-clipboard on         # let apps inside tmux (nvim) set the clipboard via OSC 52
set -g allow-passthrough on     # let apps (yazi) show images via kitty's graphics protocol
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g history-limit 50000      # bigger scrollback for long tool output
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers contiguous
set -sg escape-time 10          # stop Esc lag (matters in vim)
setw -g mode-keys vi            # vi keys in copy mode
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # full colour in Windows Terminal (kitty already has it)

# ── Status bar ────────────────────────────────────────────
# Right side: ● REC <label> while `rec` runs in the active pane, VPN/eth0 IP, clock.
# Window tabs get a red ● if any pane in them is recording (checks the active pane).
set -g status-interval 5
set -g status-right-length 80
set -g status-right "#{?#{@rec},#[bg=colour160 fg=white bold] ● REC #{@rec} #[default]  ,}#(~/.local/bin/tmux-netinfo)  %H:%M "
# Tab names: the running program, or the folder when the shell is idle (~ for home). Renaming a
# window yourself (prefix ,) keeps your name.
set -g automatic-rename on
set -g automatic-rename-format "#{?#{m:*sh,#{pane_current_command}},#{?#{==:#{pane_current_path},$HOME},~,#{b:pane_current_path}},#{pane_current_command}}"
setw -g window-status-format         "#I:#W#{?#{@rec},#[bg=colour160 fg=white]●#[default],}#{?window_flags,#{window_flags}, }"
setw -g window-status-current-format "#I:#W#{?#{@rec},#[bg=colour160 fg=white]●#[default],}#{?window_flags,#{window_flags}, }"
