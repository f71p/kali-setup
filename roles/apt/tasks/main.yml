---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags: [upgrade]

# Kali is rolling: installing onto an out-of-date system can half-upgrade it. Skip with --skip-tags upgrade.
- name: Full-upgrade the system (apt full-upgrade)
  become: true
  ansible.builtin.apt:
    upgrade: dist
  tags: [upgrade]

- name: Install python3-debian (needed to manage apt repositories)
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add third-party apt repositories
  become: true
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: deb
    uris: "{{ item.uri }}"
    suites: "{{ item.suite }}"
    components: "{{ item.components }}"
    signed_by: "{{ item.key }}"
  loop: "{{ apt_repositories }}"
  loop_control: { label: "{{ item.name }}" }
  register: apt_repos

- name: Refresh apt cache for new repositories
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: apt_repos is changed

- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
  when: apt_packages | length > 0

- name: Link fd to fdfind (Debian's name for fd; tools like yazi look for fd)
  ansible.builtin.file:
    src: /usr/bin/fdfind
    dest: "{{ target_home }}/.local/bin/fd"
    state: link
  when: "'fd-find' in apt_packages"
