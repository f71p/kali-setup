---
# XFCE keyboard shortcuts. Only the keys listed here are changed; other defaults stay.
# Avoid Win+L (Windows always locks the host) and Win+Tab/V/Shift+S (the host may grab them).

- name: Remove Win+F file manager shortcut (Win+F becomes fullscreen; Win+E still opens it)
  community.general.xfconf:
    channel: xfce4-keyboard-shortcuts
    property: /commands/custom/<Super>f
    state: absent

- name: Remove Win+1-4 workspace switching (Windows takes Win+number; Ctrl+Alt+1-4 still switches)
  community.general.xfconf:
    channel: xfce4-keyboard-shortcuts
    property: "/xfwm4/custom/<Super>{{ item }}"
    state: absent
  loop: [1, 2, 3, 4]

- name: Set app shortcuts
  community.general.xfconf:
    channel: xfce4-keyboard-shortcuts
    property: "/commands/custom/{{ item.key }}"
    value_type: string
    value: "{{ item.cmd }}"
  loop:
    - { key: "<Super>Return", cmd: kitty }
    - { key: "<Super>space",  cmd: xfce4-appfinder --collapsed }
  loop_control: { label: "{{ item.key }} = {{ item.cmd }}" }

- name: Set window and workspace shortcuts
  community.general.xfconf:
    channel: xfce4-keyboard-shortcuts
    property: "/xfwm4/custom/{{ item.key }}"
    value_type: string
    value: "{{ item.action }}"
  loop:
    - { key: "<Super>BackSpace", action: close_window_key }
    - { key: "<Super>f",         action: fullscreen_key }
    - { key: "<Super>Left",      action: tile_left_key }
    - { key: "<Super>Right",     action: tile_right_key }
    - { key: "<Shift><Super>1", action: move_window_workspace_1_key }
    - { key: "<Shift><Super>2", action: move_window_workspace_2_key }
    - { key: "<Shift><Super>3", action: move_window_workspace_3_key }
    - { key: "<Shift><Super>4", action: move_window_workspace_4_key }
  loop_control: { label: "{{ item.key }} = {{ item.action }}" }

- name: Use 4 workspaces
  community.general.xfconf:
    channel: xfwm4
    property: /general/workspace_count
    value_type: int
    value: 4
