---
# configs/home/   mirrors $HOME  (copied as the user)
# configs/system/ mirrors /      (copied as root)
# Existing files are backed up with a timestamp suffix before being overwritten.

# No mode on directories: create missing ones, never change permissions of existing ones.
- name: Create home directories
  ansible.builtin.file:
    path: "{{ target_home }}/{{ item.path }}"
    state: directory
  loop: "{{ lookup('community.general.filetree', configs_dir ~ '/home', wantlist=True) | selectattr('state', 'eq', 'directory') | list }}"
  loop_control: { label: "{{ item.path }}" }

- name: Copy home config files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ target_home }}/{{ item.path }}"
    mode: "{{ item.mode }}"
    backup: true
  loop: "{{ lookup('community.general.filetree', configs_dir ~ '/home', wantlist=True) | selectattr('state', 'eq', 'file') | rejectattr('path', 'search', '\\.gitkeep$') | list }}"
  loop_control: { label: "{{ item.path }}" }

- name: Keep only the newest {{ dotfiles_backups_kept }} backups of each home config file
  ansible.builtin.shell: |
    n=0
    for f in {{ lookup('community.general.filetree', configs_dir ~ '/home', wantlist=True)
                | selectattr('state', 'eq', 'file') | map(attribute='path')
                | map('regex_replace', '^', target_home ~ '/') | map('quote') | join(' ') }}; do
      for old in $(ls -1t -- "$f".*~ 2>/dev/null | tail -n +{{ dotfiles_backups_kept + 1 }}); do
        rm -f -- "$old" && n=$((n+1))
      done
    done
    echo "removed $n"
  register: dotfiles_prune
  changed_when: dotfiles_prune.stdout != 'removed 0'

- name: Create system directories
  become: true
  ansible.builtin.file:
    path: "/{{ item.path }}"
    state: directory
  loop: "{{ lookup('community.general.filetree', configs_dir ~ '/system', wantlist=True) | selectattr('state', 'eq', 'directory') | list }}"
  loop_control: { label: "/{{ item.path }}" }

- name: Copy system config files
  become: true
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
    backup: true
  loop: "{{ lookup('community.general.filetree', configs_dir ~ '/system', wantlist=True) | selectattr('state', 'eq', 'file') | rejectattr('path', 'search', '\\.gitkeep$') | list }}"
  loop_control: { label: "/{{ item.path }}" }

# Built from Kali's own logo (not stored in the repo); fetch falls back to plain fastfetch without it.
# Skipped until imagemagick (apt tag) is installed.
- name: Generate the fetch logo
  ansible.builtin.shell: |
    command -v convert >/dev/null || { echo skipped; exit 0; }
    {{ target_home }}/.local/bin/fetch-logo
  args:
    creates: "{{ target_home }}/.local/share/fetch/logo.gif"
  register: fetch_logo
  changed_when: fetch_logo.stdout != 'skipped'
