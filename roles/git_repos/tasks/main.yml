---
- name: Ensure repos directory exists
  ansible.builtin.file:
    path: "{{ git_repos_dir }}"
    state: directory
    mode: "0755"

- name: Clone git repos
  ansible.builtin.git:
    repo: "{{ url }}"
    dest: "{{ dest }}"
    depth: 1
    update: false
  vars:
    url: "{{ item.split()[0] }}"
    dest: "{{ (item.split()[1] | regex_replace('^~', target_home)) if item.split() | length > 1
              else git_repos_dir ~ '/' ~ (url | basename | regex_replace('\\.git$', '')) }}"
  loop: "{{ git_repos }}"
