---
- name: "{{ gh_repo }}: look up latest release"
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ gh_repo }}/releases/latest"
    headers: { Accept: application/vnd.github+json }
  register: gh_release

- name: "{{ gh_repo }}: pick asset"
  ansible.builtin.set_fact:
    gh_asset: "{{ gh_release.json.assets | selectattr('name', 'search', gh_pattern) | first }}"
    gh_tag: "{{ gh_release.json.tag_name }}"
    gh_state_file: "{{ github_releases_state_dir }}/{{ gh_repo | replace('/', '__') }}"
    gh_archive: "{{ (gh_release.json.assets | selectattr('name', 'search', gh_pattern) | first).name is search('\\.(tar\\.gz|tgz|tar\\.xz|zip)$') }}"

- name: "{{ gh_repo }}: read installed version"
  ansible.builtin.slurp:
    src: "{{ gh_state_file }}"
  register: gh_installed
  failed_when: false

- name: "{{ gh_repo }}: install {{ gh_tag }}"
  when: >-
    gh_installed.content is not defined
    or (gh_installed.content | b64decode | trim) != gh_tag
    or gh_binaries | map('regex_replace', '^', target_home ~ '/.local/bin/') | reject('file') | list | length > 0
  block:
    - name: "{{ gh_repo }}: create temp dir"
      ansible.builtin.tempfile:
        state: directory
      register: gh_tmp

    - name: "{{ gh_repo }}: download {{ gh_asset.name }}"
      ansible.builtin.get_url:
        url: "{{ gh_asset.browser_download_url }}"
        dest: "{{ gh_tmp.path }}/{{ gh_asset.name }}"
        checksum: "{{ gh_asset.digest | default(omit, true) }}"
        mode: "0644"

    - name: "{{ gh_repo }}: unpack"
      ansible.builtin.unarchive:
        src: "{{ gh_tmp.path }}/{{ gh_asset.name }}"
        dest: "{{ gh_tmp.path }}"
      when: gh_archive

    - name: "{{ gh_repo }}: find {{ gh_binaries | join(', ') }}"
      ansible.builtin.find:
        paths: "{{ gh_tmp.path }}"
        patterns: "{{ gh_binaries if gh_archive else [gh_asset.name] }}"
        recurse: true
      register: gh_found
      failed_when: gh_found.matched != (gh_binaries | length if gh_archive else 1)

    - name: "{{ gh_repo }}: install to ~/.local/bin"
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ target_home }}/.local/bin/{{ item.path | basename if gh_archive else gh_binaries[0] }}"
        mode: "0755"
      loop: "{{ gh_found.files }}"
      loop_control: { label: "{{ item.path | basename }}" }

    - name: "{{ gh_repo }}: record installed version"
      ansible.builtin.copy:
        content: "{{ gh_tag }}\n"
        dest: "{{ gh_state_file }}"
        mode: "0644"

  always:
    - name: "{{ gh_repo }}: remove temp dir"
      ansible.builtin.file:
        path: "{{ gh_tmp.path }}"
        state: absent
      when: gh_tmp.path is defined
