---
- name: Ensure install and state directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ target_home }}/.local/bin"
    - "{{ github_releases_state_dir }}"

- name: Install GitHub release binaries
  ansible.builtin.include_tasks: install.yml
  vars:
    gh_repo: "{{ release_line.split()[0] }}"
    gh_pattern: "{{ release_line.split()[1] }}"
    gh_binaries: "{{ (release_line.split()[2] if release_line.split() | length > 2 else gh_repo.split('/')[1] | lower).split(',') }}"
  loop: "{{ github_releases }}"
  loop_control:
    loop_var: release_line
    label: "{{ release_line.split()[0] }}"
