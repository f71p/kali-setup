---
# What `kali-tweaks` -> Virtualization -> VMware does, plus mounting shared folders at boot.
# kali-tweaks installs open-vm-tools-desktop and copies two helper scripts from its data
# directory into /usr/local/sbin; we do the same, non-interactively, but use our own
# restart-vm-tools (theirs restarts the clipboard part as root, which breaks copy/paste).

- name: Install VMware guest packages
  become: true
  ansible.builtin.apt:
    name: [open-vm-tools-desktop, fuse3, kali-tweaks]
    state: present

- name: Install kali-tweaks' mount-shared-folders helper
  become: true
  ansible.builtin.copy:
    src: /usr/lib/kali_tweaks/data/mount-shared-folders
    dest: /usr/local/sbin/mount-shared-folders
    remote_src: true
    mode: "0755"

- name: Install restart-vm-tools (fixes copy/paste)
  become: true
  ansible.builtin.copy:
    src: restart-vm-tools
    dest: /usr/local/sbin/restart-vm-tools
    mode: "0755"

# This machine's sudo searches only /usr/sbin:/usr/bin:/sbin:/bin, so `sudo mount-shared-folders` fails.
# Restore Debian's usual path (adds /usr/local). Checked with visudo first: a bad file would break sudo.
- name: Let sudo find commands in /usr/local
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/secure-path
    content: 'Defaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"'
    mode: "0440"
    validate: visudo -cf %s

- name: Install boot-time shared folder mount service
  become: true
  ansible.builtin.copy:
    src: mount-shared-folders.service
    dest: /etc/systemd/system/mount-shared-folders.service
    mode: "0644"
  register: vmware_unit

- name: Enable and start shared folder mounting
  become: true
  ansible.builtin.systemd_service:
    name: mount-shared-folders.service
    enabled: true
    state: "{{ 'restarted' if vmware_unit is changed else 'started' }}"
    daemon_reload: "{{ vmware_unit is changed }}"
